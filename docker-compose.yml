version: "3.9"

services:
  backend:
    build: ./backend
    container_name: ai-dev-workspace-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - workspace_db:/app/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DAYTONA_API_KEY=${DAYTONA_API_KEY}
      - DAYTONA_API_URL=${DAYTONA_API_URL:-https://app.daytona.io/api}
      - DAYTONA_TARGET=${DAYTONA_TARGET:-us}
      - DATABASE_URL=sqlite+aiosqlite:////app/data/workspace.db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: ai-dev-workspace-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

volumes:
  workspace_db:
