[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daytona-backend"
version = "0.1.0"
description = "Backend service for Daytona workspace"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "langgraph==0.2.28",
  "langchain-openai==0.2.3",
  "langchain-core==0.3.12",
  "daytona>=0.113.2",
  "sqlalchemy==2.0.35",
  "aiosqlite==0.20.0",
  "python-dotenv==1.0.1",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]